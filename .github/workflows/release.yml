name: Build and release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build binaries (amd64 + arm64)
        run: make build-batocera build-batocera-arm64

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp openrgb-batocera-server-batocera dist/openrgb-batocera-server-linux-amd64
          cp openrgb-batocera-server-batocera-arm64 dist/openrgb-batocera-server-linux-arm64
          cd dist && sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
